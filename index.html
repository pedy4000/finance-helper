<style>

@media (prefers-color-scheme:dark){.gtabs button.on{color:var(--on-brand)}}

.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--brand)}.cal .d.on{background:var(--brand);color:var(--on-brand);font-weight:700}
.itemc{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px;display:grid;gap:6px}
.ihead{display:flex;gap:6px;align-items:center}.ihead .input{flex:1}.irow{display:grid;grid-template-columns:1fr 1.4fr;gap:6px}.itemc .input{padding:9px 10px}

@media (prefers-color-scheme:dark){.sopt{color:var(--on-brand)}}

<script>
'use strict';
// ---------- تنظیمات و اتصال ----------
const LS = { get: k => { try { return localStorage.getItem('fin.' + k) || ''; } catch (e) { return ''; } }, set: (k, v) => { try { localStorage.setItem('fin.' + k, v); } catch (e) {} } };
(function fromHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('u')) LS.set('api', h.get('u'));
  if (h.get('t')) LS.set('token', h.get('t'));
  if (h.get('me') && !LS.get('me')) LS.set('me', h.get('me'));
})();
const cfg = { get api() { return LS.get('api'); }, get token() { return LS.get('token'); }, get me() { return LS.get('me'); } };
async function call(url, opts) {
  let r;
  try { r = await fetch(url, Object.assign({ redirect: 'follow' }, opts)); }
  catch (e) { throw new Error('به اسکریپت شیت وصل نشد. اینترنت یا فیلترشکن را چک کن و دوباره امتحان کن.'); }
  const t = (await r.text()).trim();
  let j;
  try { j = JSON.parse(t); } catch (e) {
    if (t.indexOf('خطا') === 0) throw new Error(t.replace(/^خطا:\s*/, ''));
    if (/<html|<!doctype/i.test(t)) throw new Error('آدرس Web app درست نیست یا دسترسی‌اش روی Anyone نیست.');
    throw new Error('اسکریپت شیت هنوز نسخه‌ی قبلی است. در Apps Script: کد جدید را Save کن، بعد Deploy ← Manage deployments ← مداد ← New version ← Deploy.');
  }
  if (!j.ok) throw new Error(j.error || 'خطا');
  return j.data;
}
function apiGet(params) {
  const u = new URL(cfg.api);
  Object.entries(Object.assign({}, params, { token: cfg.token })).forEach(([k, v]) => u.searchParams.set(k, v));
  return call(u.toString());
}
function apiPost(body) {
  return call(cfg.api, { method: 'POST', body: JSON.stringify(Object.assign({}, body, { token: cfg.token })) });
}

// ---------- ابزار نمایش ----------
const TOMAN = 'تومان';
const fa = s => String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const latin = s => String(s).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 0x06F0).replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x0660).replace(/٫/g, '.').replace(/[٬,\s]/g, '');
function num(x, dec) {
  let s = Math.abs(x).toFixed(dec === undefined ? 0 : dec);
  if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
  const p = s.split('.');
  return (x < 0 && Number(s) !== 0 ? '−' : '') + fa(p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '٬') + (p[1] ? '٫' + p[1] : ''));
}
function money(x) {
  const a = Math.abs(x);

    const planBox = cr ? h('div', { class: 'plan', id: 'plan' },
      h('div', { class: 'field' }, h('label', null, 'چند قسط؟'), h('div', { class: 'step' },
        h('button', { type: 'button', 'aria-label': 'قسط کمتر', onclick: () => setInst(F.inst - 1) }, '−'), h('b', null, F.inst === 1 ? 'یک‌جا' : fa(F.inst) + ' قسط'), h('button', { type: 'button', 'aria-label': 'قسط بیشتر', onclick: () => setInst(F.inst + 1) }, '+'))),
      F.inst > 1 ? h('div', { class: 'field' }, h('label', null, 'قسط اول'), h('div', { class: 'chips' },
        cards.map(a => h('button', { class: 'chip' + (F.first === 'now' && F.payFrom === a.name ? ' on' : ''), type: 'button', onclick: () => { F.first = 'now'; F.payFrom = a.name; draw(); } }, 'الان از ' + a.name)),
        h('button', { class: 'chip' + (F.first === 'later' ? ' on' : ''), type: 'button', onclick: () => { F.first = 'later'; draw(); } }, 'از ماه بعد'))) : null,
      planRows) : null;
    fillPlan();
    const mult = unit === TOMAN ? h('div', { class: 'chips', style: 'justify-content:center' }, [['هزار', 1e3], ['میلیون', 1e6]].map(([l, m]) => h('button', { class: 'chip', type: 'button', onclick: () => { const v = parse(F.amount); if (v) { F.amount = String(Math.round(v * m)); draw(); } } }, '× ' + l))) : null;
    const accChips = (value, pick, filter) => h('div', { class: 'chips' }, b.accounts.filter(filter || (() => true)).map(a => h('button', { class: 'chip' + (a.name === value ? ' on' : ''), type: 'button', onclick: () => { pick(a.name); draw(); } }, a.name)));
    const tomanOnly = a => a.unit === TOMAN && a.kind !== 'دارایی دیگر';
    const catalog = () => { const seen = new Set(), out = []; (b.flowers || []).concat(FLOWERS).forEach(n => { const k = norm(n); if (!seen.has(k)) { seen.add(k); out.push(n); } }); return out; };
    const itemRow = (x, i) => {
      const sug = h('div', { class: 'sug' });
      const name = h('input', { class: 'input', placeholder: 'نوع گل را بنویس یا انتخاب کن', value: x.name, autocomplete: 'off', 'aria-label': 'نوع گل' });
      const pick = v => { x.name = v; name.value = v; sug.replaceChildren(); name.blur(); if (!(b.flowers || []).some(n => norm(n) === norm(v))) b.flowers = [v].concat(b.flowers || []); };
      const fill = () => {
        const q = name.value.trim(), all = catalog();
        const found = all.map((n, k) => ({ n: n, s: fscore(q, n), k: k })).filter(o => o.s > 0).sort((p1, p2) => p2.s - p1.s || p1.k - p2.k).slice(0, 6);
        const exact = all.some(n => norm(n) === norm(q));
        sug.replaceChildren(...found.map(o => h('button', { class: 'sopt', type: 'button', onpointerdown: e => { e.preventDefault(); pick(o.n); } }, o.n)),
          ...(q && !exact ? [h('button', { class: 'sopt add', type: 'button', onpointerdown: e => { e.preventDefault(); pick(q); } }, '+ افزودن «' + q + '»')] : []));
      };
      name.addEventListener('input', () => { x.name = name.value; fill(); });
      name.addEventListener('focus', fill);
      name.addEventListener('blur', () => setTimeout(() => sug.replaceChildren(), 200));
      return h('div', { class: 'itemc' },
        h('div', { class: 'ihead' }, name, h('button', { class: 'x', type: 'button', 'aria-label': 'حذف قلم', onclick: () => { F.items.splice(i, 1); draw(); } }, '×')), sug,
        h('div', { class: 'irow' },
          h('input', { class: 'input', placeholder: 'تعداد', inputmode: 'decimal', value: x.qty, 'aria-label': 'تعداد', oninput: e => { x.qty = e.target.value; refresh(); } }),
          h('input', { class: 'input', placeholder: 'قیمت هر شاخه (تومان)', inputmode: 'decimal', value: x.price, 'aria-label': 'قیمت هر شاخه', oninput: e => { x.price = e.target.value; refresh(); } })));
    };
    const dp = F.date.split('/').map(Number), yesterday = jShift(b.today, -1);
    if (!F.cal) F.cal = { open: false, y: dp[0], m: dp[1] };
    const setDate = v => { F.date = v; F.cal.open = false; draw(); };
    const calendar = () => {
      const c = F.cal, first = jWeekday(c.y, c.m, 1), cells = [];
      for (let k = 0; k < first; k++) cells.push(h('span'));
      for (let d = 1; d <= jDays(c.y, c.m); d++) { const v = jStr(c.y, c.m, d); cells.push(h('button', { class: 'd' + (v === F.date ? ' on' : '') + (v === b.today ? ' today' : '') + (v > b.today ? ' fut' : ''), type: 'button', 'aria-label': fa(d) + ' ' + MONTHS[c.m - 1], onclick: () => setDate(v) }, fa(d))); }
      const move = n => { c.m += n; if (c.m < 1) { c.m = 12; c.y--; } if (c.m > 12) { c.m = 1; c.y++; } draw(); };
      return h('div', { class: 'cal' }, h('div', { class: 'ch' }, h('button', { class: 'mini', type: 'button', onclick: () => move(-1) }, 'ماه قبل'), h('b', null, MONTHS[c.m - 1] + ' ' + fa(c.y)), h('button', { class: 'mini', type: 'button', onclick: () => move(1) }, 'ماه بعد')),
        h('div', { class: 'g' }, ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'].map(w => h('span', { class: 'w' }, w)), cells));
    };
    const other = F.date !== b.today && F.date !== yesterday;
    const dateChips = [h('div', { class: 'chips' },
      h('button', { class: 'chip' + (F.date === b.today ? ' on' : ''), type: 'button', onclick: () => setDate(b.today) }, 'امروز'),
      h('button', { class: 'chip' + (F.date === yesterday ? ' on' : ''), type: 'button', onclick: () => setDate(yesterday) }, 'دیروز'),
      h('button', { class: 'chip' + (other ? ' on' : ''), type: 'button', 'aria-label': 'انتخاب تاریخ', 'aria-expanded': F.cal.open ? 'true' : 'false', onclick: () => { F.cal.open = !F.cal.open; F.cal.y = dp[0]; F.cal.m = dp[1]; draw(); } }, (other ? dateText(F.date) + ' ' + fa(dp[0]) : 'روز دیگر') + ' ▾')),
      F.cal.open ? calendar() : null];
    const submit = h('button', { class: 'btn', type: 'button', onclick: save }, 'ثبت');
    async function save() {
      const body = { a: 'add', type: F.type, scope: F.scope, account: F.acc, by: cfg.me, note: F.note, party: F.scope === 'گل‌فروشی' && F.type === 'درآمد' ? F.party : '' };
      body.date = F.date;
      if (conv) { body.to = F.to; body.amount = parse(F.amount); body.to_amount = parse(F.toAmount) || ''; }
      else { body.category = F.cat; if (buying && F.items.length) body.items = F.items.map(x => ({ name: x.name, qty: parse(x.qty), price: parse(x.price) })); else body.amount = parse(F.amount); }
      if (cr) { body.installments = F.inst; body.first = F.inst > 1 ? F.first : 'later'; if (body.first === 'now') body.pay_from = F.payFrom; }
      if (!conv && !F.cat) return toast('دسته را انتخاب کن', true);
      if (!F.acc) return toast('حساب را انتخاب کن', true);
      if (conv && !F.to) return toast('حساب مقصد را انتخاب کن', true);
      if (!(body.amount > 0) && !(body.items && body.items.length)) return toast('مبلغ را وارد کن', true);
      submit.disabled = true; submit.textContent = 'در حال ثبت…';
      try { body.boot = 1; const r = await apiPost(body); S.boot = r.boot; close(); toast(r.message); if (S.tab === 'report') S.report.data = null; render(); }
      catch (e) { toast(e.message, true); submit.disabled = false; submit.textContent = 'ثبت'; }
    }
    const oldSheet = root.querySelector('.sheet'), keepTop = oldSheet ? oldSheet.scrollTop : 0, oldTabs = root.querySelector('.gtabs'), keepLeft = oldTabs ? oldTabs.scrollLeft : null;
    root.replaceChildren(h('div', { class: 'sheet-bg', onclick: e => { if (e.target.classList.contains('sheet-bg')) close(); } }, h('div', { class: 'sheet', role: 'dialog', 'aria-label': 'ثبت تراکنش' },
      h('div', { class: 'shead' }, h('h2', null, 'ثبت تراکنش'), h('button', { class: 'icon-btn', 'aria-label': 'بستن', onclick: close }, '×')),
      seg(['خرج', 'درآمد', TRANSFER], conv ? TRANSFER : F.type, v => { F.type = v === TRANSFER ? CONV : v; F.cat = ''; F.grp = ''; draw(); }),
      conv ? h('div', { class: 'hint' }, 'کارت به کارت، برداشت تتر به کارت، خرید طلا و دلار') : seg(['خانه', 'گل‌فروشی'], F.scope, v => { F.scope = v; F.cat = ''; F.grp = ''; F.items = []; draw(); }),
      buying ? null : h('div', { class: 'field' }, amount, mult),
      hint,
      conv ? [h('div', { class: 'field' }, h('label', null, 'از حساب'), accChips(F.acc, v => { F.acc = v; }, a => !a.credit)),
        h('div', { class: 'field' }, h('label', null, 'به حساب'), accChips(F.to, v => { F.to = v; }, a => a.name !== F.acc)),
        F.to && unit !== toUnit ? h('div', { class: 'field' }, h('label', null, 'چقدر به «' + F.to + '» رسید؟ (' + toUnit + ')'),
          h('input', { class: 'input', inputmode: 'decimal', style: 'direction:ltr;text-align:center', value: F.toAmount, placeholder: '۰', 'aria-label': 'مبلغ مقصد', oninput: e => { F.toAmount = e.target.value; hint.textContent = previewText(); } })) : null]
        : [h('div', { class: 'field' }, h('label', null, 'دسته', F.cat ? [': ', h('b', null, F.cat)] : null),
            h('div', { class: 'gtabs', role: 'tablist', 'aria-label': 'گروه دسته‌ها' }, gtabs.map(g => h('button', { class: g === F.grp ? 'on' : '', type: 'button', onclick: () => { F.grp = g; draw(); } }, g))),
            h('div', { class: 'cgrid' }, shown.map(c => h('button', { class: 'cbtn' + (c.name === F.cat ? ' on' : ''), type: 'button', onclick: () => { F.cat = c.name; if (c.name === 'خرید گل' && !F.items.length) F.items = [{ name: '', qty: '', price: '' }]; draw(); } }, c.name)))),
          buying ? h('div', { class: 'field' }, h('label', null, 'گل‌های خریده‌شده (جمع خودکار حساب می‌شود)'), h('div', { class: 'items' }, F.items.map(itemRow)),
            h('button', { class: 'mini', type: 'button', style: 'justify-self:start', onclick: () => { F.items.push({ name: '', qty: '', price: '' }); draw(); } }, '+ گل دیگر')) : null,
          h('div', { class: 'field' }, h('label', null, F.type === 'خرج' ? 'از کدام حساب؟' : 'به کدام حساب؟'), accChips(F.acc, v => { if (v !== F.acc) F.inst = null; F.acc = v; }, F.type === 'خرج' ? tomanOnly : a => a.kind !== 'دارایی دیگر' && !a.credit)),
          planBox,
          shop && F.type === 'درآمد' ? h('div', { class: 'field' }, h('label', null, 'مشتری'), h('input', { class: 'input', value: F.party, placeholder: 'اختیاری', 'aria-label': 'مشتری', oninput: e => { F.party = e.target.value; } })) : null],
      h('div', { class: 'field' }, h('label', null, 'تاریخ'), dateChips),
      h('div', { class: 'field' }, h('label', null, 'توضیحات'), h('input', { class: 'input', value: F.note, placeholder: 'اختیاری', 'aria-label': 'توضیحات', oninput: e => { F.note = e.target.value; } })),
      submit)));
    // فرم با هر انتخاب دوباره کشیده می‌شود؛ جای اسکرول صفحه و ردیف گروه‌ها باید همان بماند و گروه انتخاب‌شده دیده شود
    const sheet = root.querySelector('.sheet'), tabsEl = root.querySelector('.gtabs');
    sheet.scrollTop = keepTop;
    const calEl = sheet.querySelector('.cal'); if (calEl) calEl.scrollIntoView({ block: 'nearest' }); // تقویم پایین فرم باز می‌شود؛ باید دیده شود
    if (tabsEl) { if (keepLeft !== null) tabsEl.scrollLeft = keepLeft; const on = tabsEl.querySelector('.on'); if (on) { const r = on.getBoundingClientRect(), t = tabsEl.getBoundingClientRect(); if (r.left < t.left) tabsEl.scrollLeft -= t.left - r.left + 8; else if (r.right > t.right) tabsEl.scrollLeft += r.right - t.right + 8; } }
  }
  draw();
}

// ---------- شروع ----------
function viewSetup() {
  document.getElementById('tabs').hidden = true;
  const api = h('input', { class: 'input', style: 'direction:ltr', placeholder: 'https://script.google.com/macros/s/…/exec', value: cfg.api, 'aria-label': 'آدرس' });
  const tok = h('input', { class: 'input', style: 'direction:ltr', placeholder: 'token', value: cfg.token, 'aria-label': 'توکن' });
  let me = cfg.me || 'پدرام';
  const draw = () => app.replaceChildren(h('div', { class: 'stack' }, header('دخل و خرج', 'اتصال به شیت', h('span')),
    h('div', { class: 'card stack' }, h('div', { class: 'field' }, h('label', null, 'آدرس Web app'), api), h('div', { class: 'field' }, h('label', null, 'توکن'), tok),
      h('div', { class: 'field' }, h('label', null, 'این گوشی مال کیه؟'), seg(['پدرام', 'سعیده'], me, v => { me = v; draw(); }))),
    h('button', { class: 'btn', onclick: () => { LS.set('api', api.value.trim()); LS.set('token', tok.value.trim()); LS.set('me', me); start(); } }, 'شروع')));
  draw();
}
function start() {
  if (!cfg.api || !cfg.token || !/^https?:\/\//.test(cfg.api)) return viewSetup();
  if (!cfg.me) LS.set('me', 'پدرام');
  loadBoot();
}
document.querySelectorAll('#tabs [data-tab]').forEach(btn => btn.addEventListener('click', () => { S.tab = btn.dataset.tab; if (S.tab === 'report') S.report.data = null; render(); }));
document.getElementById('plus').addEventListener('click', () => openAdd()); // not openAdd directly: the click event would arrive as the preset
start();
</script>
